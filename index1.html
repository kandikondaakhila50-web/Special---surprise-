<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Surprise</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #fff1b8, #d9f7ff);
}

.card {
  width: 92%;
  max-width: 560px;
  padding: 32px 22px;
  text-align: center;
  background: rgba(255,255,255,0.9);
  border-radius: 28px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.15);
}

h1 {
  font-size: 32px;
}

.sub {
  font-size: 18px;
  margin-bottom: 25px;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 30px;
  margin: 8px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#yes {
  background: #ff5c8a;
  color: white;
}

#no {
  background: #eeeeee;
  color: #333;
}

#message {
  display: none;
  line-height: 1.7;
  font-size: 20px;
}

.confetti {
  position: fixed;
  top: -20px;
  width: 10px;
  height: 16px;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}

.heart {
  position: fixed;
  font-size: 28px;
  animation: float 4s linear forwards;
}

@keyframes float {
  from {
    transform: translateY(100vh);
  }
  to {
    transform: translateY(-15vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div id="start">
    <h1>Oka Chinna Surprise 🎉🎊</h1>

    <div class="sub">
      Click cheyyi... special surprise undi!
    </div>

    <button id="yes" onclick="celebrate()">YES ❤️</button>

    <button id="no" onclick="noClick()">NO 😏</button>
  </div>

  <div id="message">

    <h1>I LOVE YOU NANAHHH ❤️</h1>

    <p>
      E roju chaala special gaa undee...<br>
      E day ni epatiki marchi polenuu ❤️
      <br><br>

      <b>11/9/26</b>

      <br><br>

      Chaala happyy gaa feel ithunaa!<br>

      THANK YOU SOO MUCH BANGARUUUUU ❤️
    </p>

  </div>

</div>

<script>

function confetti() {

  for (let i = 0; i < 100; i++) {

    const c = document.createElement("div");

    c.className = "confetti";

    c.style.left = Math.random() * 100 + "vw";

    c.style.animationDuration =
      (2 + Math.random() * 3) + "s";

    c.style.background =
      ["#ff4d6d","#ffd166","#06d6a0","#4dabf7","#9b5de5"]
      [Math.floor(Math.random() * 5)];

    document.body.appendChild(c);

    setTimeout(() => c.remove(), 5500);
  }

  for (let i = 0; i < 18; i++) {

    const h = document.createElement("div");

    h.className = "heart";

    h.textContent =
      ["❤️","💖","💕","🎉","🎊"]
      [Math.floor(Math.random() * 5)];

    h.style.left = Math.random() * 100 + "vw";

    h.style.animationDuration =
      (3 + Math.random() * 3) + "s";

    document.body.appendChild(h);

    setTimeout(() => h.remove(), 6500);
  }
}

function noClick() {

  const noButton = document.getElementById("no");

  noButton.textContent = "YES 😆";

  noButton.onclick = celebrate;
}

function celebrate() {

  confetti();

  document.getElementById("start").style.display = "none";

  document.getElementById("message").style.display = "block";
}

</script>

</body>
</html>
